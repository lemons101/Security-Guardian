openclaw:
  部署环境: 云服务器
  运行时: OpenClaw + Claude Code
  数字员工: OpenClaw

控制面:
  websocket:
    监听地址: "0.0.0.0:7070"
    强鉴权: false
    Origin校验: false
    允许远程关闭安全策略: true

技能:
  reconcile-plus:
    来源: 社区市场
    信任等级: community
    签名校验: false
    沙盒:
      启用: false
      出站策略: allow
      可访问目录:
        - /lab/data/workspace
        - /lab/data/finance
        - /lab/data/secrets

治理:
  高危命令黑名单: []
  审计日志:
    启用: false
  Token熔断:
    启用: false
